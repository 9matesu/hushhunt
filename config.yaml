llm:
  base_url: "https://api.b.ai/v1"   # 9router; use http://localhost:20128/v1 for TokenRouter/qwen
  model: "ag/glm-4.6"
  temperature: 0.0
  prices:                       # USD per 1M tokens [input, output] (cost meter)
    glm-4.6: [0.4, 1.6]         # local TokenRouter models: omit => cost 0 (honest)
limits:
  rate_per_second_per_target: 1
  daily_requests_per_program: 150
  max_requests_per_asset: 12
  request_timeout_seconds: 10
  user_agent: "hushhunt/0.1 (hunter=matco; contact=<account email>; https://github.com/9matesu/hushhunt)"
  active:                       # v2: active testing budgets (grant-gated on top)
    daily_requests_per_program: 400
    burst_rate_per_second: 2
oast:                           # out-of-band canaries for blind findings
  enabled: false                # OQ-V1: decide interactsh self-host vs public
  server: "https://api.projectdiscovery.io"
sessions:
  file: "seeds/accounts.yaml"   # throwaway test accounts (passwords in ENV only)
selection:
  small_target_max_bounty: 1500
  new_program_days: 540
  max_targets_per_night: 6
  min_signals_to_triage: 1
triage:
  min_confidence: 0.75
submit:
  mode: "draft"
platforms:
  hackerone: {enabled: true}
  bugcrowd: {enabled: true}
