llm:
  base_url: "http://localhost:20128/v1"   # 9router / TokenRouter endpoint
  model: "ag/gemini-3.8-flash"            # Fast, high-accuracy reasoning model on 9router
  temperature: 0.0
  prices:                                 # USD per 1M tokens [input, output]
    gemini-3.8-flash: [0.15, 0.60]
    gemini-3.7-flash: [0.15, 0.60]
    claude-sonnet-4-6: [3.0, 15.0]
limits:
  rate_per_second_per_target: 1
  daily_requests_per_program: 150
  max_requests_per_asset: 12
  request_timeout_seconds: 10
  user_agent: "hushhunt/0.1 (hunter=matco; contact=<account email>; https://github.com/9matesu/hushhunt)"
  proxy_url: ""                 # optional egress proxy, e.g. http://user:***@vps:3128
  active:                       # v2: active testing budgets (grant-gated on top)
    daily_requests_per_program: 400
    burst_rate_per_second: 2
oast:                           # out-of-band canaries for blind findings
  enabled: true                 # OAST active for blind SSRF / RCE canary proofs
  server: "https://oast.fun"     # ProjectDiscovery / interactsh public listener
  poll_timeout_seconds: 5
sessions:
  file: "seeds/accounts.yaml"   # throwaway test accounts (passwords in ENV only)
selection:
  small_target_max_bounty: 1500
  new_program_days: 540
  max_targets_per_night: 6
  min_signals_to_triage: 1
triage:
  min_confidence: 0.75
submit:
  mode: "draft"
auto_grant:                     # operator opt-in: pipeline mints grants itself
  enabled: true                 # policy-lint/risk_cap/demotion STILL gate above it
  deep: true                    # allow blast-radius modules (idor/sqli-bool/oast/rce/nuclei)
  risk_cap: "high"              # applied only where you never set a cap by hand
  ttl_hours: 24                 # each auto grant expires daily
  max_requests: 150             # per program/day active-request headroom
platforms:
  hackerone: {enabled: true}
  bugcrowd: {enabled: true}
  bbscope: {enabled: true}       # token-free mirror (bbscope.com); used while
                                 # platform tokens are missing/broken
